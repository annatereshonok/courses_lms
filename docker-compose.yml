services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine

  web:
    image: ${DOCKERHUB_USERNAME:-local}/lms-app:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - static:/app/staticfiles

  worker:
    image: ${DOCKERHUB_USERNAME:-local}/lms-app:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["bash", "-lc", "celery -A config worker -l INFO"]

  beat:
    image: ${DOCKERHUB_USERNAME:-local}/lms-app:${IMAGE_TAG:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ["bash", "-lc", "celery -A config beat -l INFO"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - static:/static:ro
      - ./compose/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  static: