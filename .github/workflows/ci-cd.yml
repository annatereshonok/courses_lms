name: CI/CD via Docker Hub (LMS)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build_push_deploy:
    runs-on: ubuntu-latest

    env:
      REGISTRY: docker.io
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage (SQLite)
        env:
          USE_SQLITE: "1"
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: compose/web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-app:${{ env.IMAGE_TAG }}

      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Debug workspace tree
        run: |
          echo "===== WORKSPACE INFO ====="
          echo "Current path: $(pwd)"
          echo "Repo root contents:"
          ls -la
          echo
          echo "Looking for docker-compose files:"
          find . -maxdepth 3 -name "docker-compose.y*"
          echo
          echo "Looking for nginx.conf:"
          find . -maxdepth 4 -name "nginx.conf" -o -path "*/nginx/*.conf"
          echo
          echo "Git branch / commit info:"
          git rev-parse --abbrev-ref HEAD || true
          git rev-parse --short HEAD || true
          echo "==========================="

      - name: Upload compose + nginx config
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /srv/lms/compose/nginx"
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            docker-compose.yml \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/lms/
          rsync -az -e "ssh -p ${{ secrets.SSH_PORT }}" \
            compose/nginx/nginx.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/srv/lms/compose/nginx/nginx.conf

      - name: Write .env on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "printf '%s\n' \"${{ secrets.ENV_PROD }}\" > /srv/lms/.env && chmod 600 /srv/lms/.env"

      - name: Deploy on server
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /srv/lms
            docker compose -f docker-compose.yml pull
            docker compose -f docker-compose.yml up -d
            docker compose -f docker-compose.yml ps
          EOF
